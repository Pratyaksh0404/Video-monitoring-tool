# ── Person Detection ──────────────────────────────────────────────
  person:
    min_height: 60          # px — ignore tiny detections
    min_width: 30           # px
    face_tolerance: 0.5     # face_recognition distance threshold (raised 0.4→0.5 for appearance changes)

  # ── Crowd ─────────────────────────────────────────────────────────
  crowd:
    threshold: 4            # persons >= this count = crowd
    post_crowd_grace: 10.0  # seconds after crowd ends — unknown alerts suppressed
    post_crowd_loiter: 15.0 # seconds after crowd ends — loitering alerts suppressed

  # ── Unknown Person ────────────────────────────────────────────────
  unknown:
    grace_seconds: 12       # seconds before unknown person alert fires
    spatial_tolerance: 200  # px — slot reuse proximity
    time_tolerance: 30.0    # seconds — slot memory after track dies
    alert_suppress_secs: 60.0  # seconds — minimum gap between alerts per slot
    max_slot_number: 10     # cap slot numbers — recycle after this
    sideways_radius: 200    # px — suppress unknown if known guard centroid this close
    single_person_grace: 15.0  # seconds — if 1 person + guard recently seen, suppress unknown

  # ── Fire / Smoke ──────────────────────────────────────────────────
  fire:
    min_confidence: 0.55    # per-reading threshold for fire/flames class
    sustain_seconds: 6.0    # time window for hit accumulation
    min_consecutive: 3      # hits needed within sustain_seconds to fire alert
    frame_interval: 20      # run fire model every N frames
    result_max_age: 8.0     # discard fire results older than this (seconds)
    disable_smoke_class: true  # ignore "smoke" class entirely — too many false positives indoors

  # ── Weapons ───────────────────────────────────────────────────────
  weapon:
    confidence: 0.75        # minimum confidence for weapon alert
    draw_knife_bbox: true   # draw bounding box on frame for knife detections

  # ── Behavior (CLIP) ──────────────────────────────────────────────
  behavior:
    interval_frames: 50     # frames between CLIP readings (~9s at 5.5fps)
    idle_max_speed: 12.0    # px/frame — above this = person is moving

    # CLIP minimum confidence thresholds (per label)
    clip_thresholds:
      NORMAL: 0.25
      SLEEPING: 0.55           # raised from 0.45 — looking down ≠ sleeping
      PHONE_USE: 0.50
      IDLE: 0.50
      DISTRACTED_OTHER: 0.45
      SMOKING: 0.70            # raised from 0.65 — hand near face ≠ smoking

    # BehaviorEngine majority-vote confirm ratios
    confirm_ratios:
      SMOKING: 0.85            # raised from 0.75 — extremely strict (7 of 8 readings)
      SLEEPING: 0.70           # raised from 0.60 — needs 6 of 8 readings
      PHONE_USE: 0.60
      IDLE: 0.60
      DISTRACTED_OTHER: 0.55

    # Idle detection: use_clip=false means rely solely on InactivityMonitor
    idle_use_clip: false

  # ── Loitering ─────────────────────────────────────────────────────
  loitering:
    unknown_zone_time: 30   # seconds — unknown person in same zone
    known_zone_time: 90     # seconds — known guard in same zone

  # ── Fight / Violence ─────────────────────────────────────────────
  fight:
    proximity_factor: 0.8   # × avg box height — must be very close
    motion_threshold: 20.0  # px/frame — both persons must move this fast
    confirm_seconds: 5.0    # sustained conditions before fight alert fires

  # ── Patrol ────────────────────────────────────────────────────────
  patrol:
    display_zones: 3        # last N zones shown in patrol alert

  # ── Alerts ────────────────────────────────────────────────────────
  alerts:
    cooldown: 30            # seconds — general alert repeat cooldown
    missing_cooldown: 30    # seconds — Guard Missing repeat cooldown
    idle_cooldown: 60       # seconds — Guard Idle repeat cooldown (longer to reduce spam)
    idle_startup_grace: 90  # seconds — suppress idle for first 90s after pipeline start

  # ── Tracker ──────────────────────────────────────────────────────
  tracker:
    max_disappeared: 40     # frames before track is deregistered (raised from 30)
    max_distance: 300       # px — max centroid distance for association

  # ── Email Alerts ─────────────────────────────────────────────────
  # Sends email for high-severity events (weapon, fire, fight, guard missing)
  # To use Gmail: enable 2FA, then create App Password at
  # https://myaccount.google.com/apppasswords
  email:
    enabled: true           # Set to true to enable email alerts
    smtp_server: smtp.gmail.com
    smtp_port: 587
    sender: ""               # sender's email id
    password: ""             # Gmail App Password (NOT your real password)
    recipients: []           # receiver's email id
    alert_types:
      - Weapon Detected
      - Unattended Weapon Detected
      - Fire / Smoke Detected
      - Fight / Violence Detected
      - Guard Under Attack
      - Guard Sleeping
      - Guard Missing
      - Guard Smoking
      - Camera Tamper
    cooldown: 200            # seconds between emails of same type (5 min)