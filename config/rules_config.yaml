# ═══════════════════════════════════════════════════════════════════════════
# NoviSentra — rules_config.yaml
# Single global baseline. Scenario-specific behavior (bank/retail/warehouse/
# restaurant) comes from novisentra/profiles/ overriding a small subset of
# these values at runtime per-camera — this file does NOT need duplicating
# per scenario. See camera_config.yaml for which camera runs which profile.
# ═══════════════════════════════════════════════════════════════════════════

# Fallback profile for single-camera / not-yet-assigned deployments.
# Multi-camera deployments set this per-camera in camera_config.yaml instead —
# this value only matters when a camera's config doesn't specify one.
active_profile: guard_monitoring   # guard_monitoring | bank_security | retail_analytics
                                    # | warehouse_ops | restaurant_billing

# ── Person Detection ──────────────────────────────────────────────
person:
  min_height: 60
  min_width: 30
  face_tolerance: 0.5

# ── Crowd ─────────────────────────────────────────────────────────
crowd:
  threshold: 4
  post_crowd_grace: 10
  post_crowd_loiter: 15.0

# ── Unknown Person ────────────────────────────────────────────────
unknown:
  grace_seconds: 12
  spatial_tolerance: 200
  time_tolerance: 30.0
  alert_suppress_secs: 60.0
  max_slot_number: 10
  sideways_radius: 200
  single_person_grace: 15.0

# ── Fire / Smoke ──────────────────────────────────────────────────
fire:
  min_confidence: 0.55       # bank_security overrides to 0.65 at runtime
  sustain_seconds: 6
  min_consecutive: 3
  frame_interval: 20
  result_max_age: 8.0
  disable_smoke_class: true

# ── Weapons ───────────────────────────────────────────────────────
weapon:
  confidence: 0.75           # bank_security overrides to 0.82 at runtime
  draw_knife_bbox: true

# ── Behavior (CLIP) ──────────────────────────────────────────────
behavior:
  interval_frames: 50
  idle_max_speed: 12
  clip_thresholds:
    NORMAL: 0.25
    SLEEPING: 0.85          # high threshold — only confirm when clearly sleeping
    PHONE_USE: 0.5
    IDLE: 0.5
    DISTRACTED_OTHER: 0.45
    SMOKING: 0.7
  confirm_ratios:
    SMOKING: 0.85
    SLEEPING: 0.95           # very strict — needs 9 of 10 readings consistently
    PHONE_USE: 0.6
    IDLE: 0.60
    DISTRACTED_OTHER: 0.55
  idle_use_clip: false

# ── Loitering ─────────────────────────────────────────────────────
loitering:
  unknown_zone_time: 30      # retail_analytics overrides both to 600 at runtime
  known_zone_time: 90        # (10 min — normal browsing shouldn't alert)

# ── Fight / Violence ─────────────────────────────────────────────
fight:
  proximity_factor: 0.8
  motion_threshold: 20.0
  confirm_seconds: 5.0

# ── Patrol ────────────────────────────────────────────────────────
patrol:
  display_zones: 3

# ── Alerts ────────────────────────────────────────────────────────
alerts:
  cooldown: 30
  missing_cooldown: 30
  idle_cooldown: 60
  idle_startup_grace: 90

# ── Tracker ──────────────────────────────────────────────────────
tracker:
  max_disappeared: 40
  max_distance: 300

# ═══════════════════════════════════════════════════════════════════════════
# Email Alerts — Brevo (production transport, 300/day free forever —
# switched from SMTP because Gmail SMTP breaks on cloud servers, and from
# Resend because Resend's 100/day cap is too low for multi-camera deployments)
# ═══════════════════════════════════════════════════════════════════════════
email:
  enabled: true
  transport: brevo             # "brevo" (production) | "smtp" (dev/fallback only)

  brevo:
    from_address: "alerts@yourdomain.com"   # MUST be on a domain verified in Brevo
    from_name: "NoviSentra"
    # API key comes from env var, never store it in this file:
    #   export BREVO_API_KEY=xkeysib-xxxxxxxxxxxxxxxxxxxx

  # Kept only for local/dev testing — do NOT use in production.
  smtp_server: smtp.gmail.com
  smtp_port: 587
  sender: ""               # sender's email id (smtp fallback only)
  password: ""             # Gmail App Password (smtp fallback only)

  recipients: []            # receiver's email id(s)
  alert_types:
  - Weapon Detected
  - Unattended Weapon Detected
  - Fire Detected
  - Fight / Violence Detected
  - Guard Under Attack
  - Guard Sleeping
  - Guard Missing
  - Guard Smoking
  - Camera Tamper
  cooldown: 200

# ═══════════════════════════════════════════════════════════════════════════
# WhatsApp Alerts — Twilio (production transport — Chrome automation breaks
# on any headless server; also note WhatsApp Business API requires a
# pre-approved message template for any business-initiated message, hence
# the content_sid field below and per-alert immediate sends instead of
# batching — see whatsapp_alerter.py module docstring for full setup steps)
# ═══════════════════════════════════════════════════════════════════════════
whatsapp:
  enabled: false
  transport: twilio         # "twilio" (production) | "chrome" (dev/local only) | "stub"
  recipient_number: ""      # Recipient number in E.164 format: "+919876543210"
                            # (quotes required — unquoted numbers break YAML)

  twilio:
    from_number: "whatsapp:+14155238886"    # your Twilio WhatsApp sender
    content_sid: ""          # approved template SID, starts with "HX..."
    # Account credentials come from env vars, never store them here:
    #   export TWILIO_ACCOUNT_SID=ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    #   export TWILIO_AUTH_TOKEN=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # Chrome transport settings — DEV/LOCAL ONLY, ignored by transport=twilio.
  # Will not work on a headless server (needs a screen + logged-in
  # WhatsApp Web session).
  batch_size: 5             # chrome transport only — flush after N alerts
  batch_timeout: 300        # reserved / not currently enforced by either transport
  page_load_wait: 19
  chrome_profile: Default

  alert_types:
  - Weapon Detected
  - Unattended Weapon Detected
  - Fire Detected
  - Fight / Violence Detected
  - Guard Under Attack
  - Guard Sleeping
  - Guard Missing
  - Guard Smoking
  - Camera Tamper

pipeline:
  max_width: 640
  skip_frames: 2
