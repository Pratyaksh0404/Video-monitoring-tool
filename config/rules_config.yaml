# ── Person Detection ──────────────────────────────────────────────
person:
  min_height: 60
  min_width: 30
  face_tolerance: 0.5

# ── Crowd ─────────────────────────────────────────────────────────
crowd:
  threshold: 4
  post_crowd_grace: 10.0
  post_crowd_loiter: 15.0

# ── Unknown Person ────────────────────────────────────────────────
unknown:
  grace_seconds: 12
  spatial_tolerance: 200
  time_tolerance: 30.0
  alert_suppress_secs: 60.0
  max_slot_number: 10
  sideways_radius: 200
  single_person_grace: 15.0

# ── Fire / Smoke ──────────────────────────────────────────────────
fire:
  min_confidence: 0.55
  sustain_seconds: 6.0
  min_consecutive: 3
  frame_interval: 20
  result_max_age: 8.0
  disable_smoke_class: true

# ── Weapons ───────────────────────────────────────────────────────
weapon:
  confidence: 0.75
  draw_knife_bbox: true

# ── Behavior (CLIP) ──────────────────────────────────────────────
behavior:
  interval_frames: 50
  idle_max_speed: 12.0
  clip_thresholds:
    NORMAL: 0.25
    SLEEPING: 0.75          # high threshold — only confirm when clearly sleeping
    PHONE_USE: 0.50
    IDLE: 0.50
    DISTRACTED_OTHER: 0.45
    SMOKING: 0.70
  confirm_ratios:
    SMOKING: 0.85
    SLEEPING: 0.95           # very strict — needs 9 of 10 readings consistently
    PHONE_USE: 0.60
    IDLE: 0.60
    DISTRACTED_OTHER: 0.55
  idle_use_clip: false

# ── Loitering ─────────────────────────────────────────────────────
loitering:
  unknown_zone_time: 30
  known_zone_time: 90

# ── Fight / Violence ─────────────────────────────────────────────
fight:
  proximity_factor: 0.8
  motion_threshold: 20.0
  confirm_seconds: 5.0

# ── Patrol ────────────────────────────────────────────────────────
patrol:
  display_zones: 3

# ── Alerts ────────────────────────────────────────────────────────
alerts:
  cooldown: 30
  missing_cooldown: 30
  idle_cooldown: 60
  idle_startup_grace: 90

# ── Tracker ──────────────────────────────────────────────────────
tracker:
  max_disappeared: 40
  max_distance: 300

# ── Email Alerts ─────────────────────────────────────────────────
email:
  enabled: true
  smtp_server: smtp.gmail.com
  smtp_port: 587
  sender: ""               # sender's email id
  password: ""             # Gmail App Password (NOT your real password)
  recipients: []           # receiver's email id
  alert_types:
    - Weapon Detected
    - Unattended Weapon Detected
    - Fire Detected
    - Fight / Violence Detected
    - Guard Under Attack
    - Guard Sleeping
    - Guard Missing
    - Guard Smoking
    - Camera Tamper
  cooldown: 200

# ── WhatsApp Alerts ──────────────────────────────────────────
# Sends WhatsApp messages for high-severity events.
# Transports: stub (logs only) | pywhatkit | twilio | meta
# See whatsapp_alerter.py for full documentation.
#
# Quick start with pywhatkit (no account needed):
#   pip install pywhatkit
#   Set transport: pywhatkit, add recipients, set enabled: true
#
whatsapp:
  enabled: true           # Set to true to enable WhatsApp alerts
  transport: chrome        # chrome | twilio | meta | stub
  recipient_number: ""     # Recipient number in E.164 format: "+919876543210"
                           # (quotes required — unquoted numbers break YAML)
  batch_size: 5            # Send after this many alerts accumulate
  batch_timeout: 300       # OR after this many seconds since first alert (whichever first)
  page_load_wait: 19       # Seconds to wait for WhatsApp Web to load (tune if needed)
  chrome_profile: Default  # Chrome profile (Default, Profile 1, etc.)
  alert_types:
    - Weapon Detected
    - Unattended Weapon Detected
    - Fire Detected
    - Fight / Violence Detected
    - Guard Under Attack
    - Guard Missing
    - Guard Sleeping
    - Camera Tamper
    - Guard Smoking

# Twilio config (only needed if transport: twilio)
twilio:
  account_sid: ""
  auth_token: ""
  from_number: "whatsapp:+91__________"

# Meta Business API config (only needed if transport: meta)
meta:
  access_token: ""
  phone_number_id: ""